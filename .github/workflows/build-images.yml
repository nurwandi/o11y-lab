# Builds the app's container images and pushes them to GitHub Container Registry
# (GHCR) on every push to main. Uses the built-in GITHUB_TOKEN — no extra secrets.
#
# Published images:
#   ghcr.io/nurwandi/o11y-lab/api-node
#   ghcr.io/nurwandi/o11y-lab/service-go
#
# Note: this workflow runs on GitHub, so it can't be verified locally.
name: build-images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-node, service-go]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
