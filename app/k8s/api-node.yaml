apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-node
  template:
    metadata:
      labels:
        app: api-node
    spec:
      containers:
        - name: api-node
          image: ghcr.io/nurwandi/o11y-lab/api-node:latest
          env:
            - { name: PORT, value: "3000" }
            - { name: SERVICE_URL, value: "http://service-go:8080" }
            - { name: OTEL_SERVICE_NAME, value: "api-node" }
            - { name: OTEL_TRACES_EXPORTER, value: "otlp" }
            - { name: OTEL_METRICS_EXPORTER, value: "otlp" }
            - { name: OTEL_LOGS_EXPORTER, value: "otlp" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.platform:4318" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-node
  namespace: app
spec:
  # ClusterIP — reach it with `kubectl -n app port-forward svc/api-node 3000:3000`.
  selector:
    app: api-node
  ports:
    - port: 3000
      targetPort: 3000
