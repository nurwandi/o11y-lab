apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # ponytail: no PVC — data is ephemeral (lab). Add a PVC if you need it to survive restarts.
          env:
            - { name: POSTGRES_USER, value: o11y }
            - { name: POSTGRES_PASSWORD, value: o11y }
            - { name: POSTGRES_DB, value: o11y }
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
