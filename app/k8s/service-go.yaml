apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-go
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-go
  template:
    metadata:
      labels:
        app: service-go
    spec:
      containers:
        - name: service-go
          image: ghcr.io/nurwandi/o11y-lab/service-go:latest
          env:
            - { name: PORT, value: "8080" }
            - { name: DATABASE_URL, value: "postgres://o11y:o11y@postgres:5432/o11y?sslmode=disable" }
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: OTEL_SERVICE_NAME, value: "service-go" }
            # Cross-namespace: the Collector runs in the `platform` namespace.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.platform:4318" }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-go
  namespace: app
spec:
  selector:
    app: service-go
  ports:
    - port: 8080
      targetPort: 8080
