# Stage 3 platform overlay: the full observability stack (OpenTelemetry Collector
# + LGTM) plus the app, all on one network. This supersedes the Stage 2 Jaeger
# overlay (docker-compose.otel.yml).
#
#   docker compose -f docker-compose.yml -f docker-compose.platform.yml up --build
#
# UIs:
#   Grafana     http://localhost:3001   (anonymous admin)
#   Prometheus  http://localhost:9090
#   Tempo API   http://localhost:3200
#   Loki API    http://localhost:3100
#
# Config lives under ../platform/ so it can be reused as Kubernetes ConfigMaps in
# Stage 5.
name: o11y-lab-app

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../platform/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (scraped by Prometheus)
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../platform/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../platform/loki/loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../platform/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # Repoint the app at the Collector, and turn on all three signals.
  service-go:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      otel-collector:
        condition: service_started

  api-node:
    environment:
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      otel-collector:
        condition: service_started
