# Prometheus — metrics storage. It pulls (scrapes) metrics; here it scrapes the
# OpenTelemetry Collector, which re-exposes the apps' OTLP metrics in Prometheus
# format on :8889 (and its own internal metrics on :8888).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
